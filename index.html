<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seh hisobi</title>
<style>
:root{--bg:#f6f4f0;--cd:#fff;--tx:#1f1d1a;--mu:#6f6a62;--ac:#c2570c;--ln:#e4dfd7;--ok:#17803d;--no:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--cd:#242120;--tx:#f1ede7;--mu:#a29b90;--ac:#f08a3c;--ln:#38332e;--ok:#4cc27a;--no:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--cd:#242120;--tx:#f1ede7;--mu:#a29b90;--ac:#f08a3c;--ln:#38332e;--ok:#4cc27a;--no:#ff7b72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;color:var(--mu);margin:18px 0 8px;font-weight:600}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cd span{color:var(--mu);font-size:14px}.cd b{display:block;text-align:right}.cd small{display:block;text-align:right;color:var(--mu);font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .cd{display:block;margin:0}.g .cd b,.g .cd small{text-align:left}
.ok{color:var(--ok)}.no{color:var(--no)}
button,.bt{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;width:100%}
button.s{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}button.d{background:var(--no)}
.r{display:flex;gap:8px;margin:10px 0}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1 0 auto;padding:10px 12px;font-size:13px;text-align:center;color:var(--mu);border-radius:10px;white-space:nowrap}
nav a.on{color:var(--ac);font-weight:700;background:var(--bg)}
#sh{display:none;position:fixed;inset:0;z-index:20}.bk{position:absolute;inset:0;background:#0008}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--cd);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.em{color:var(--mu);text-align:center;padding:16px}
body{padding-bottom:104px}
h1{font-size:24px;letter-spacing:-.4px}
.cd{border-radius:18px;border-color:transparent;box-shadow:0 1px 2px #0000000d,0 6px 16px #00000008;transition:transform .12s}
.cd:active,button:active{transform:scale(.98)}
button{background:linear-gradient(135deg,var(--ac),#e8892f);box-shadow:0 4px 12px #c2570c33;border-radius:14px;padding:14px}
button.s{background:var(--cd);box-shadow:none}button.d{background:var(--no)}
input,select,textarea{border-radius:12px;padding:13px}
.hero{background:linear-gradient(135deg,#b94a08,#f08a3c);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 10px 24px #c2570c40}
.hero small{display:block;opacity:.85;font-size:13px}.hero b{font-size:30px;display:block;margin:2px 0 10px}.hero .hr{display:flex;gap:18px}.hero .hr div{flex:1}.hero .hr b{font-size:18px;margin:0}
nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--ln);border-radius:24px;padding:6px;box-shadow:0 8px 24px #0002}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 10px;min-width:62px;border-radius:18px}
nav a i{font-style:normal;font-size:20px}nav a.on{background:var(--ac);color:#fff}
.bars{display:flex;align-items:flex-end;gap:6px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:3px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.tl a{background:var(--cd);border-radius:18px;padding:12px 2px 10px;text-align:center;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 1px 2px #0000000d,0 6px 16px #00000008}
.tl a:active{transform:scale(.95)}
.tl a span{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.back{display:flex;align-items:center;justify-content:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.cal i{font-style:normal;text-align:center;font-size:11px;color:var(--mu)}
.cal a{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:14px;background:var(--bg)}
.cal a.has{background:var(--ac);color:#fff;font-weight:700}.cal a.tdy{outline:2px solid var(--ac)}.cal a small{font-size:10px;line-height:1}
#lgb{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;width:auto;padding:6px 12px;border-radius:99px;font-size:13px}
</style></head><body>
<div class="w" id="app"></div><div id="sh"></div>
<script>
var F=[],S=null,U=null,DB=null,V='home',SUB=null,FS=null;
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var today=function(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
var e=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fm=function(n){return Math.round(n||0).toLocaleString('ru-RU')};
var sum=function(a,f){return (a||[]).reduce(function(t,x){return t+f(x)},0)};
var fn=function(f){return 'F['+(F.push(f)-1)+']()'};
var m=function(n,c){return '<b class="'+(c||'')+'">'+fm(n)+' so’m</b>'+(DB.rate>0?'<small>≈ $'+(n/DB.rate).toFixed(2)+'</small>':'')};
var save=function(){if(!S||!DB||!window.FB)return;clearTimeout(wt);wt=setTimeout(flush,500)};
var ld=function(c){try{return JSON.parse(localStorage.getItem('seh:'+c))}catch(x){return null}};
var mod=function(id){var x=DB.models.filter(function(y){return y.id==id})[0];if(!x)return{name:'(o‘chirilgan)',price:0};return x.code?Object.assign({},x,{name:x.name+' · '+x.code}):x};
var pl=function(r){return r=='kosib'?'Kosib':r=='pardoz'?'Pardozchi':'Zakatovkachi'};
var lg=function(t){DB.log=DB.log||[];DB.log.push({t:t,u:U&&U.name,d:new Date().toISOString().slice(0,16).replace('T',' ')})};

/* hisob-kitob */
var wEarn=function(w){return sum(DB.work.filter(function(x){return x.w==w.id&&!x.cid}),function(x){return x.n*x.p})};
var wBal=function(w){return wEarn(w)-sum(w.adv.filter(function(x){return !x.cid}),function(x){return x.a})-sum(w.paid.filter(function(x){return !x.cid}),function(x){return x.a})};
var cTot=function(c){return sum(c.ord,function(x){return x.n*x.s})};
var cDebt=function(c){return cTot(c)-sum(c.pay,function(x){return x.a})};
var sBal=function(s){return sum(s.en,function(x){return x.t=='+'?x.a:-x.a})};
var profit=function(d,r){return sum(DB.work.filter(function(x){return (!d||x.d==d)&&(!r||mod(x.m).role==r)}),function(x){var md=mod(x.m);return md.sale>0?x.n*(md.sale-(md.cost||0)):0})};
var sProfit=function(f){return sum(DB.clients,function(c){return sum(c.ord.filter(function(x){return f(x.d)}),function(x){return x.n*(x.s-(x.c||0))})})};
var rentPaid=function(f){return sum(DB.rent||[],function(r){return sum(r.pay.filter(function(x){return !f||f(x.d)}),function(x){return x.a})})};
var spent=function(d){return sum(DB.exp.filter(function(x){return !d||x.d==d}),function(x){return x.a})+rentPaid(d?function(y){return y==d}:null)};
var debts=function(){var a=[],b=[];
 DB.sup.forEach(function(s){var v=sBal(s);if(v>0)a.push([s.name,v]);if(v<0)b.push([s.name,-v])});
 DB.workers.forEach(function(w){var v=wBal(w);if(v>0)a.push([w.name+' (ishchi)',v])});
 DB.clients.forEach(function(c){var v=cDebt(c);if(v>0)b.push([c.name+' (klent)',v])});
 return{a:a,b:b}};

/* oyna va forma */
function closeS(){$('#sh').style.display='none';$('#sh').innerHTML=''}
function sheet(h){$('#sh').innerHTML='<div class="bk" onclick="closeS()"></div><div class="sh">'+h+'</div>';$('#sh').style.display='block'}
function form(title,fields,cb,del){
 var h='<h1>'+title+'</h1>';
 fields.forEach(function(f){var v=f.v==null?'':f.v;
  h+='<label>'+f.l+'</label>';
  if(f.o)h+='<select id="f_'+f.k+'">'+f.o.map(function(o){return '<option value="'+e(o[0])+'"'+(o[0]==v?' selected':'')+'>'+e(o[1])+'</option>'}).join('')+'</select>';
  else if(f.t=='area')h+='<textarea id="f_'+f.k+'" rows="6">'+e(v)+'</textarea>';
  else h+='<input id="f_'+f.k+'" type="'+(f.t=='n'?'number':f.t||'text')+'"'+(f.t=='n'?' inputmode="decimal" step="any"':'')+' value="'+e(v)+'">'});
 h+='<div class="r"><button onclick="FS()">Saqlash</button>'+(del?'<button class="d" onclick="FD()">O‘chirish</button>':'')+'</div><button class="s" onclick="closeS()">Bekor qilish</button>';
 sheet(h);
 FS=function(){var o={};fields.forEach(function(f){var x=$('#f_'+f.k).value;o[f.k]=f.t=='n'?parseFloat(x)||0:x.trim()});
  if(fields[0].req!==false&&!o[fields[0].k]&&fields[0].t!='n')return;cb(o);save();closeS();R()};
 FD=function(){if(confirm('O‘chirilsinmi?')){del();save();closeS();SUB=null;R()}}}
function go(v,s){V=v;SUB=s||null;R();window.scrollTo(0,0)}

/* kirish */
var LOADING=true,PEND=false,REQ=[],MODE='in',unsubS=null,unsubR=null,wt=null;
var EM={'auth/email-already-in-use':'Bu login band','auth/invalid-credential':'Login yoki parol noto‘g‘ri','auth/wrong-password':'Parol noto‘g‘ri','auth/user-not-found':'Bunday login yo‘q','auth/weak-password':'Parol kamida 6 belgi bo‘lsin','auth/network-request-failed':'Internet yo‘q','permission-denied':'Ruxsat yo‘q'};
var gv=function(i){return $('#'+i).value.trim()};
var emOf=function(l){var x=l.toLowerCase().replace(/[^a-z0-9._-]/g,'');return x?x+'@sehhisob.app':''};
function loginView(){
 var reg=MODE=='reg';
 return '<h1>Seh hisobi</h1><div class="cd" style="display:block">'
 +(reg?'<label>Ismingiz</label><input id="rn"><label>Siz kimsiz?</label><select id="rr"><option value="b">Seh egasi (boshliq)</option><option value="kosib">Ishchi — kosib</option><option value="zakat">Ishchi — zakatovkachi</option><option value="pardoz">Ishchi — pardozchi</option></select><label>Seh kodi (boshliq yangi kod o‘ylab topadi, ishchi boshliqdan oladi)</label><input id="rc" autocapitalize="off"><label>Seh nomi (faqat boshliq uchun)</label><input id="rs">':'')
 +'<label>Login (telefon raqam yoki ism, lotin harflarda)</label><input id="rl" autocapitalize="off"><label>Parol (kamida 6 belgi)</label><input id="rp" type="password">'
 +'<button onclick="'+(reg?'doReg()':'doLogin()')+'">'+(reg?'Ro‘yxatdan o‘tish':'Kirish')+'</button></div>'
 +'<button class="s" onclick="MODE=\''+(reg?'in':'reg')+'\';R()">'+(reg?'Akkauntim bor — kirish':'Yangi akkaunt yaratish')+'</button>'}
async function doLogin(){
 if(!window.FB)return alert('Firebase ulanmagan: firebase-config.js ni to‘ldiring');
 var em=emOf(gv('rl')),pw=$('#rp').value;if(!em||!pw)return alert('Login va parolni kiriting');
 try{await FB.signInWithEmailAndPassword(FB.auth,em,pw)}catch(err){alert(EM[err.code]||err.message)}}
async function doReg(){
 if(!window.FB)return alert('Firebase ulanmagan: firebase-config.js ni to‘ldiring');
 var nm=gv('rn'),lgn=gv('rl'),pw=$('#rp').value,r=$('#rr').value,c=gv('rc').toLowerCase().replace(/[^a-z0-9_-]/g,''),sn=gv('rs')||nm+' sexi',em=emOf(lgn);
 if(!nm||!em||!c||pw.length<6)return alert('Hamma maydonni to‘ldiring, parol kamida 6 belgi');
 try{
  var ci=await FB.getDoc(FB.doc(FB.db,'codes',c)),ex=ci.exists(),op=ex&&ci.data().open===true;
  if(r=='b'&&ex)return alert('Bu seh kodi band, boshqasini tanlang');
  if(r!='b'&&!ex)return alert('Bunday seh kodi topilmadi');
  var u=(await FB.createUserWithEmailAndPassword(FB.auth,em,pw)).user;
  await FB.setDoc(FB.doc(FB.db,'users',u.uid),{name:nm,role:r,shop:c,login:lgn});
  if(r=='b'){
   var d={name:sn,rate:0,models:[],workers:[],work:[],clients:[],sup:[],partners:[],exp:[],rent:[],log:[]};
   await FB.setDoc(FB.doc(FB.db,'shops',c),{owner:u.uid,j:JSON.stringify(d)});
   await FB.setDoc(FB.doc(FB.db,'shops',c,'pub','models'),{n:sn,j:'[]'});
   await FB.setDoc(FB.doc(FB.db,'codes',c),{owner:u.uid,name:sn,open:false})}
  else if(op)await FB.setDoc(FB.doc(FB.db,'shops',c,'workers',u.uid),{name:nm,role:r,ok:true,j:JSON.stringify({work:[],adv:[],paid:[],cl:[]})});
  else await FB.setDoc(FB.doc(FB.db,'shops',c,'requests',u.uid),{name:nm,role:r,at:Date.now()});
  loadUser(u)}
 catch(err){alert(EM[err.code]||err.message)}}
async function loadUser(u){
 if(unsubS)unsubS();if(unsubR)unsubR();unsubS=unsubR=null;
 try{var us=await FB.getDoc(FB.doc(FB.db,'users',u.uid));
  if(!us.exists()){LOADING=false;return R()}
  var x=us.data();U={role:x.role,name:x.name,wid:u.uid};S=x.shop;watch()}
 catch(err){LOADING=false;alert(EM[err.code]||err.message);R()}}
var BASE=null,WD={},SELF=null,PUB=null,PS='',PM='',WS={},unsubP=null,unsubW=null,DSL=[],DSED=null;
var pmStr=function(){return JSON.stringify(DB.models.map(function(x){return{id:x.id,name:ml(x),role:x.role,price:x.price,act:x.act}}))};
function splitDB(){var base=JSON.parse(JSON.stringify(DB)),wd={};
 var acc=function(id){return DB.workers.some(function(w){return w.acc&&w.id==id})};
 base.work=DB.work.filter(function(x){return !acc(x.w)});
 base.workers=DB.workers.map(function(w){if(!w.acc)return w;
  wd[w.id]={work:DB.work.filter(function(x){return x.w==w.id}),adv:w.adv,paid:w.paid,cl:w.cl||[],ok:w.ok!==false};
  return{id:w.id,name:w.name,phone:w.phone||'',role:w.role,ok:w.ok!==false,acc:true}});
 return{base:base,wd:wd}}
function flush(){wt=null;var db=FB.db,er=function(err){alert('Saqlanmadi: '+err.message)};
 if(U.role!='b'){var w=DB.workers[0];FB.updateDoc(FB.doc(db,'shops',S,'workers',U.wid),{j:JSON.stringify({work:DB.work,adv:w.adv,paid:w.paid,cl:w.cl||[]})}).catch(er);return}
 var sp=splitDB(),b=JSON.stringify(sp.base),pm=DB.name+pmStr();
 if(b!==PS){PS=b;FB.updateDoc(FB.doc(db,'shops',S),{j:b}).catch(er)}
 if(pm!==PM){PM=pm;FB.setDoc(FB.doc(db,'shops',S,'pub','models'),{n:DB.name,j:pmStr()}).catch(er)}
 Object.keys(sp.wd).forEach(function(k){var o=sp.wd[k],js=JSON.stringify(o);
  if(js!==WS[k]){WS[k]=js;FB.updateDoc(FB.doc(db,'shops',S,'workers',k),{j:JSON.stringify({work:o.work,adv:o.adv,paid:o.paid,cl:o.cl}),ok:o.ok}).catch(er)}})}
function comb(){if(!BASE||wt)return;var d=JSON.parse(JSON.stringify(BASE));d.work=d.work||[];
 d.workers=d.workers.map(function(w){if(w.acc){var x=WD[w.id]||{};w.adv=x.adv||[];w.paid=x.paid||[];w.cl=x.cl||[];if(x.ok!==undefined)w.ok=x.ok;d.work=d.work.concat(x.work||[])}return w});
 Object.keys(WD).forEach(function(k){if(!d.workers.some(function(w){return w.id==k})){var x=WD[k];d.workers.push({id:k,name:x.name,phone:'',role:x.role,ok:x.ok,acc:true,adv:x.adv,paid:x.paid,cl:x.cl});d.work=d.work.concat(x.work)}});
 DB=d;var sp=splitDB();PS=JSON.stringify(sp.base);PM=DB.name+pmStr();
 Object.keys(sp.wd).forEach(function(k){WS[k]=JSON.stringify(sp.wd[k])});
 PEND=false;LOADING=false;R()}
function wb(){if(!SELF||!PUB||wt)return;
 DB={name:PUB.n||'',rate:0,models:JSON.parse(PUB.j||'[]'),workers:[{id:U.wid,name:U.name,role:U.role,adv:SELF.adv||[],paid:SELF.paid||[],cl:SELF.cl||[],ok:true}],work:SELF.work||[],clients:[],sup:[],partners:[],exp:[],rent:[]};
 PEND=false;LOADING=false;R()}
function stopAll(){[unsubS,unsubR,unsubP,unsubW,unsubC].forEach(function(f){if(f)f()});unsubS=unsubR=unsubP=unsubW=null;BASE=null;WD={};SELF=null;PUB=null;PS=PM='';WS={}}
function watch(){
 stopAll();var db=FB.db,er=function(){LOADING=false;R()};
 if(U.role=='b'){
  unsubS=FB.onSnapshot(FB.doc(db,'shops',S),function(s){if(s.exists())BASE=JSON.parse(s.data().j);comb()},er);
  unsubP=FB.onSnapshot(FB.collection(db,'shops',S,'pub'),function(q){q.docs.forEach(function(d){if(d.id.indexOf('img_')==0)IMG[d.id.slice(4)]=d.data().d});R()},function(){});
  unsubC=FB.onSnapshot(FB.doc(db,'codes',S),function(c){OPEN=c.exists()&&c.data().open===true;R()},function(){});
  unsubW=FB.onSnapshot(FB.collection(db,'shops',S,'workers'),function(q){WD={};q.docs.forEach(function(d){var x=d.data(),j=JSON.parse(x.j||'{}');WD[d.id]={name:x.name,role:x.role,ok:x.ok,work:j.work||[],adv:j.adv||[],paid:j.paid||[],cl:j.cl||[]}});comb()},er);
  unsubR=FB.onSnapshot(FB.collection(db,'shops',S,'requests'),function(q){REQ=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});R()},function(){})}
 else{
  unsubW=FB.onSnapshot(FB.doc(db,'shops',S,'workers',U.wid),function(s){
   if(!s.exists()||s.data().ok===false){SELF=null;DB=null;PEND=true;LOADING=false;return R()}
   SELF=JSON.parse(s.data().j||'{}');
   if(!unsubP)unsubP=FB.onSnapshot(FB.collection(db,'shops',S,'pub'),function(q){q.docs.forEach(function(d){if(d.id=='models')PUB=d.data();else if(d.id.indexOf('img_')==0)IMG[d.id.slice(4)]=d.data().d});wb()},er);
   wb()},er)}}
function boot(){FB.onAuthStateChanged(FB.auth,function(u){
 if(u)loadUser(u);
 else{stopAll();U=null;DB=null;S=null;PEND=false;REQ=[];LOADING=false;R()}})}
function logout(){FB.signOut(FB.auth)}
function pendView(){return '<h1>Boshliq tasdig‘ini kuting</h1><p style="color:var(--mu)">So‘rovingiz yuborildi. Boshliq sizni ishchilar ro‘yxatida tasdiqlagach, ish daftari o‘zi ochiladi.</p><button class="s" onclick="logout()">Chiqish</button>'}
function approve(r){
 FB.setDoc(FB.doc(FB.db,'shops',S,'workers',r.id),{name:r.name,role:r.role,ok:true,j:JSON.stringify({work:[],adv:[],paid:[],cl:[]})})
  .then(function(){DB.workers.push({id:r.id,name:r.name,phone:'',role:r.role,adv:[],paid:[],cl:[],ok:true,acc:true});save();
   return FB.deleteDoc(FB.doc(FB.db,'shops',S,'requests',r.id))}).catch(function(err){alert(err.message)})}
function reqH(){return REQ.length?'<h2>Yangi ishchi so‘rovlari</h2>'+REQ.map(function(r){return '<div class="cd"><div><b style="text-align:left">'+e(r.name)+'</b><span>'+pl(r.role)+'</span></div><div class="r" style="margin:0"><button style="width:auto" onclick="'+fn(function(){approve(r)})+'">Tasdiqlash</button><button class="s" style="width:auto" onclick="'+fn(function(){FB.deleteDoc(FB.doc(FB.db,'shops',S,'requests',r.id))})+'">Rad</button></div></div>'}).join(''):''}

/* boshliq oynalari */
function homeB(){
